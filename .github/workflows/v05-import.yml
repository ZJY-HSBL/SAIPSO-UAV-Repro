name: Verified v0.5.0 route-encoding import
on:
  push:
    paths:
      - '.bootstrap/v05.tar.xz.b64'
      - '.github/workflows/v05-import.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore versioned source
        run: |
          base64 -d .bootstrap/v05.tar.xz.b64 | tar -xJf - -C .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test Python 3.10
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python 3.12
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Independently regenerate 192 equal-FE civilian trials
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m saipso_uav.route3d_study --budget 200 --seeds 800 801 802 803 --output docs/route3d_v05
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('docs/route3d_v05')
          j=json.loads((p/'summary.json').read_text())
          rows=list(csv.DictReader((p/'metrics.csv').open()))
          assert j['total_runs']==192 and len(rows)==192
          assert all(int(r['evaluations'])==200 for r in rows)
          assert all((p/f).stat().st_size>5000 for f in ['feasibility.svg','convergence.svg','routes_3d.svg'])
          print('Verified 192 optimization runs at 200 FE each.')
          PY
      - name: Commit verified code and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .bootstrap/v05.tar.xz.b64 .github/workflows/v05-import.yml
          git add -A
          git commit -m "feat: verify full 3D waypoint encoding and civilian flight constraints"
          git push origin HEAD:main
      - name: Publish v0.5.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.0 >/dev/null 2>&1 || gh release create v0.5.0 --target "$(git rev-parse HEAD)" --title "v0.5.0 - Full 3D waypoints and flight constraints" --notes "Civilian route-encoding verification: 192 paired runs, 200 FE each, ten intermediate 3D waypoints, five flight constraint categories audited. 48/192 sampled-feasible, all corridor-initialized reference terrain. No superiority, author MATLAB replication or flight readiness is claimed."
