name: Import verified v0.2.0
on:
  push:
    paths:
      - '.bootstrap/source-v02.tar.xz.b64'
      - '.github/workflows/bootstrap-v02.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore and patch renderer compatibility
        run: |
          base64 -d .bootstrap/source-v02.tar.xz.b64 | tar -xJf - -C .
          python - <<'PY'
          from pathlib import Path
          p = Path("src/saipso_uav/study_plots.py")
          s = p.read_text()
          target = "ax.boxplot(d, labels=list(ALGORITHMS), showmeans=True)"
          assert target in s, "expected original plotting line"
          s = s.replace(target, "ax.boxplot(d, showmeans=True)\n            ax.set_xticks(np.arange(1, len(ALGORITHMS)+1))\n            ax.set_xticklabels(list(ALGORITHMS))")
          p.write_text(s)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify Python 3.10
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python 3.12
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Reproduce v0.2.0 evidence
        run: |
          python -m saipso_uav.study --budget 500 --seeds 100 101 102 103 104 105 106 107 108 109 110 111 --output docs/equal_budget
          test -s docs/equal_budget/metrics.csv
          test -s docs/equal_budget/summary.json
          test -s docs/equal_budget/feasibility_by_task.svg
      - name: Publish complete source and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .bootstrap/source-v02.tar.xz.b64 .github/workflows/bootstrap-v02.yml
          git add -A
          git commit -m "feat: equal-FE SA-IPSO study with independent civilian holdout and constraints"
          git push origin HEAD:main
      - name: Publish v0.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 >/dev/null 2>&1 || gh release create v0.2.0 --target "$(git rev-parse HEAD)" --title "v0.2.0 - Equal-FE validation" --notes "192 paired-seed civilian runs with 500 objective evaluations per arm; two terrain scenes; temperature-calibration comparison; constraint feasibility checks and SVG/CSV evidence. No claim of superiority or flight readiness."
