name: Import and verify v0.3.0
on:
  push:
    paths:
      - '.bootstrap/v03.part05'
      - '.github/workflows/v03-import.yml'
permissions:
  contents: write
jobs:
  verified-source-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore verified civilian source
        run: |
          cat .bootstrap/v03.part* | base64 -d | tar -xJf - -C .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Unit tests on Python 3.10
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests on Python 3.12
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
      - name: Recreate all 1080 research runs and SVG evidence
        run: |
          python -m saipso_uav.study_v03 --budget 500 --seeds $(seq 300 329) --output docs/feasibility_v03
          test -s docs/feasibility_v03/metrics.csv
          test -s docs/feasibility_v03/summary.json
          test -s docs/feasibility_v03/feasibility_rate.svg
          python - <<'PY'
          import json
          d=json.load(open("docs/feasibility_v03/summary.json"))
          assert d["total_runs"] == 1080
          assert d["objective_evaluations_per_run"] == 500
          PY
      - name: Commit tested source and research evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/ci.yml
          git rm .bootstrap/v03.part*
          git add -A
          git commit -m "feat: v0.3 feasibility-first study with 1080 equal-FE trials"
          git push origin HEAD:main
      - name: Publish v0.3.0
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release view v0.3.0 >/dev/null 2>&1 || gh release create v0.3.0 --target "$(git rev-parse HEAD)" --title "v0.3.0 | Feasibility-first ablations" --notes "Civilian synthetic terrain benchmark; six feature ablations, 30 fresh seeds, three synthetic scenes and two objective weights, 500 combined fitness/constraint evaluation calls per run. Includes independent 201-sample terrain audit, exact straight-segment circular-airspace intersection, raw CSV/JSON and 13 SVG figures. This is not a flight safety certificate or an exact numerical reproduction of the original article."